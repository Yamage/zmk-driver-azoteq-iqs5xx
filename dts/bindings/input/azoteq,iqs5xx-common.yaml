properties:
  rdy-gpios:
    type: phandle-array
    description: "Data Ready pin for the Azoteq IQS5xx trackpad"
  
  reset-gpios:
    type: phandle-array
    description: "Reset pin for the Azoteq IQS5xx trackpad"

  one-finger-tap:
    type: boolean
    description: "Register single finger tap gestures and report them as a left click"

  press-and-hold:
    type: boolean
    description: "Register press and hold gestures and report them as a left click until released"
  
  press-and-hold-time:
    type: int
    description: "Time in ms (in addition to the tap time) it takes to register a press and hold gesture"
    default: 250

  tap-distance:
    type: int
    description: |
      Max finger movement (in resolution units) for a touch to still count as a
      tap. Raise it if taps right after moving the cursor are missed. 0 keeps
      the chip's current setting.
    default: 0

  touch-threshold-increase:
    type: int
    description: |
      Added to the module's global touch set multiplier (0x0596). The clear
      multiplier (0x0597) is kept, so an established touch is not dropped more
      easily. Threshold = reference * (1 + multiplier / 128), so each +1 needs
      about 0.8% more signal to start a touch; raise it if a hovering finger
      counts as a touch. 0 keeps the module's setting.
    default: 0

  tap-and-drag:
    type: boolean
    description: |
      Tap, then touch again within 250 ms and keep the finger down: the left
      button stays held until the finger is lifted (drag). A quick second tap
      becomes a double click. Needs one-finger-tap.

  two-finger-tap:
    type: boolean
    description: "Register two finger tap gestures and report them as a right click"
  
  scroll:
    type: boolean
    description: "Register and report scroll gestures, both vertical and horizontal scroll is supported"

  natural-scroll-x:
    type: boolean
    description: "Whether content should track finger movement when scrolling on the x axis."

  natural-scroll-y:
    type: boolean
    description: "Whether content should track finger movement when scrolling on the y axis."

  switch-xy:
    type: boolean
    description: "Flip x and y axes"
  
  flip-x:
    type: boolean
    description: "Invert the direction of the x axis"

  flip-y:
    type: boolean
    description: "Invert the direction of the y axis"

  bottom-beta:
    type: int
    description: |
      Amount of filtering applied at slow speeds.
      0: Most filtering, smoother, but laggier.
      255: Least filtering, least smooth, more responsive.
    default: 5
  
  stationary-threshold:
    type: int
    description: |
      How far a finger must move (in pixels) to not be considered stationary.
    default: 5

  active-report-rate:
    type: int
    description: |
      Active mode report rate in milliseconds. Lower values produce a smoother,
      more responsive cursor (e.g. 7 ~= 143 Hz, 5 = 200 Hz). 0 keeps the chip
      default (10 ms / 100 Hz).
    default: 0

  x-resolution:
    type: int
    description: |
      Trackpad X resolution (max coordinate). Higher values give the chip finer
      internal tracking, producing smoother slow movement (less "staircase")
      at the cost of higher effective sensitivity; compensate the cursor speed
      with an input-processor scaler. 0 keeps the chip default.
    default: 0

  y-resolution:
    type: int
    description: |
      Trackpad Y resolution (max coordinate). See x-resolution. 0 keeps the
      chip default.
    default: 0

  rotation-deg:
    type: int
    description: |
      Rotate cursor movement by this many degrees (any angle). Positive turns
      the motion clockwise on screen; write negative values as <(-45)>.
      Applied after switch-xy / flip-x / flip-y; two-finger scroll is not
      rotated. 0 disables rotation.
    default: 0

  inertia-cursor:
    type: boolean
    description: |
      Enable trackball-like inertia for cursor movement: when the finger is
      lifted the cursor keeps moving at the release velocity and decays with
      friction. Touching the pad again stops it instantly.

  inertia-scroll:
    type: boolean
    description: |
      Enable inertia for scrolling (flick scroll): a two-finger scroll keeps
      coasting after the fingers are lifted, decaying with friction.

  inertia-friction:
    type: int
    description: |
      Fraction of the velocity retained each glide tick, out of 256. Larger =
      longer glide (less friction). 242 ~= 0.945 gives roughly a 0.6 s glide.
    default: 242

  inertia-min-speed:
    type: int
    description: |
      Minimum release speed (in counts per report) required to start a glide.
      Slower lifts stop immediately, preventing drift.
    default: 2

  inertia-tick-ms:
    type: int
    description: |
      Interval in ms between synthetic glide reports while coasting. The glide
      starts at the release speed whatever this value is.
    default: 8

  accel-gain-min:
    type: int
    description: |
      Pointer acceleration: cursor gain in percent at or below accel-speed-low.
      100 with accel-gain-max 100 disables acceleration.
    default: 100

  accel-gain-max:
    type: int
    description: |
      Pointer acceleration: cursor gain in percent at or above accel-speed-high.
      A glide keeps the gain reached at release.
    default: 100

  accel-speed-low:
    type: int
    description: |
      Finger speed (counts per report, before any input-processor scaling) up to
      which accel-gain-min applies. The gain ramps linearly up to accel-speed-high.
    default: 0

  accel-speed-high:
    type: int
    description: |
      Finger speed (counts per report) from which accel-gain-max applies.
    default: 0

  ble-min-report-interval-ms:
    type: int
    description: |
      Minimum interval in ms between emitted cursor reports when ZMK's active
      output is BLE. Reports arriving sooner are summed into the next emission so
      the BLE notification queue cannot fall behind on a noisy link. USB output
      is unaffected. 0 disables coalescing.
    default: 0
